[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantatale"
version = "0.1.0"
description = "A free, cloud-first engine for evidence-led narrated explainers and holographic animated videos."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "QuantaTale Contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
render = ["Pillow>=10,<13"]
webgl = ["playwright>=1.40,<2.0"]
tts = ["kokoro>=0.9.4,<1.0", "soundfile>=0.12,<1.0"]

[project.scripts]
quantatale = "factflow.cli:main"
factflow = "factflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factflow = ["web/*.html", "web/vendor/three/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
