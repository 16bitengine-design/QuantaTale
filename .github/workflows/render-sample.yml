name: Render QuantaTale sample video

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/render-sample.yml"
      - "src/factflow/video_render.py"
      - "src/factflow/holographic_scenes.py"
      - "src/factflow/cli.py"
      - "examples/videos/**"
      - "production/specs/**"
      - "production/topic-library.json"
      - "tests/test_video_render.py"
      - "src/factflow/web/**"
      - "src/factflow/webgl_render.py"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: quantatale-sample-render
  cancel-in-progress: false

jobs:
  render:
    name: Render and quality-check vertical sample
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core

      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: kokoro-82m-af-heart-v1

      - name: Install CPU-only PyTorch and QuantaTale rendering tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,render,tts,webgl]"
          python -m playwright install --with-deps chromium

      - name: Run renderer tests
        run: python -m pytest tests/test_video_render.py -v

      - name: Render narrated sample short
        run: quantatale render-sample examples/videos/why-the-sky-is-blue.json --output-dir build/sample-video

      - name: Render production blue-sky explainer preview
        run: quantatale render-sample examples/videos/why-the-sky-is-blue-production.json --output-dir build/production-sky-blue

      - name: Render production sunset explainer preview
        run: quantatale render-sample production/specs/sunset-red.json --output-dir build/production-sunset

      - name: Render low-poly 3D seasons explainer with voice
        run: quantatale render-sample examples/videos/earth-seasons-lowpoly.json --output-dir build/lowpoly-seasons

      - name: Upload low-poly 3D sample for visual review
        uses: actions/upload-artifact@v4
        with:
          name: quantatale-lowpoly-3d-sample
          path: build/lowpoly-seasons/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload sample video and production assets
        uses: actions/upload-artifact@v4
        with:
          name: quantatale-sample-video
          path: build/sample-video/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload production video previews for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: quantatale-production-video-previews
          path: |
            build/production-sky-blue/*
            build/production-sunset/*
          if-no-files-found: error
          retention-days: 14
