name: QuantaTale CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantatale-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, validate, assess evidence and discover leads
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install QuantaTale and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run automated tests
        run: python -m pytest

      - name: Report flat animations still used by topics
        run: python -m factflow.cli motif-report

      - name: Report sentences that state a lone number
        run: python -m factflow.cli number-report

      - name: Validate sample topic
        run: quantatale validate examples/topics/why-the-sky-is-blue.json

      - name: Generate evidence assessment report
        run: |
          mkdir -p build
          quantatale research-report examples/topics/why-the-sky-is-blue.json --output build/research-report.json

      - name: Discover candidate story leads
        run: quantatale discover --limit 30 --output build/discovery-candidates.json

      - name: Extract source-backed claim candidates
        run: quantatale research-candidates build/discovery-candidates.json --limit 10 --output build/research-candidates.json

      - name: Discover scholarly metadata through Crossref and Europe PMC
        run: quantatale scholarly-discover build/research-candidates.json --claim-limit 20 --results-per-provider 5 --output build/scholarly-leads.json

      - name: Retrieve open-access scholarly passages from Europe PMC
        run: quantatale scholarly-retrieve build/scholarly-leads.json --article-limit 20 --passages-per-article 40 --output build/scholarly-passages.json

      - name: Discover related evidence and build review dossiers
        run: quantatale evidence-dossier build/research-candidates.json --feed-limit 100 --article-limit 20 --output build/evidence-dossiers.json

      - name: Compare collected evidence passages with claim candidates
        run: quantatale evidence-compare build/research-candidates.json --scholarly build/scholarly-passages.json --dossiers build/evidence-dossiers.json --passage-limit-per-claim 100 --output build/evidence-comparisons.json

      - name: Upload discovery and research reports
        uses: actions/upload-artifact@v4
        with:
          name: quantatale-research-reports
          path: build/*.json
          if-no-files-found: error
          retention-days: 7
